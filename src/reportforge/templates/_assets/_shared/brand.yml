color:
  palette:
    ink: "#22303f"
    navy: "#1a2e4a"
    steel: "#3d6b9e"
    slate: "#5b6b7f"
    gold: "#c9a227"
    mist: "#f2f5f8"
  foreground: "#22303f"
  background: "#ffffff"
  primary: "#1a2e4a"
  secondary: "#3d6b9e"
  tertiary: "#5b6b7f"
  success: "#2e7d32"
  info: "#3d6b9e"
  warning: "#c9a227"
