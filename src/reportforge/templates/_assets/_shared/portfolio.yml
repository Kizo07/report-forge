project:
  type: default
  output-dir: output

execute:
  jupyter: <% jupyter_kernel %>
  echo: false
  warning: false
  message: false
  fig-dpi: 300
  freeze: auto

number-sections: false

crossref:
  fig-title: Exhibit
  tbl-title: Table
  fig-prefix: Exhibit
  tbl-prefix: Table
  sec-prefix: Section

# Vendored Quarto extensions (_shared/_extensions/, quarto-add equivalent).
# Names match each extension's _extension.yml directory per its docs:
# iconify shortcode + preload filter, highlight-text span filter.
filters:
  - iconify
  - highlight-text

format:
  html:
    toc: <% toc %>
    toc-depth: 3
    # Built-in Quarto >= 1.4 lightbox (native `lightbox: true`) — NOT the
    # quarto-lightbox extension (no filter to register).
    lightbox: true
    theme:
      - brand
      - styles.scss
    include-before-body: assets/portfolio-header.html
    title-block-style: none
    code-fold: true
    code-tools: false
    link-external-newwindow: true
  typst:
    papersize: <% papersize %>
    mainfont: Inter
    fontsize: 10.5pt
    template-partials:
      - assets/typst-template.typ
      - assets/typst-show.typ
  docx:
    reference-doc: assets/reference-doc.docx
    toc: <% toc %>
