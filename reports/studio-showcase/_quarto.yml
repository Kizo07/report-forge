project:
  type: default
  output-dir: output

execute:
  jupyter: reportforge
  echo: false
  warning: false
  message: false
  fig-dpi: 300
  freeze: auto

number-sections: false

crossref:
  fig-title: Figure
  tbl-title: Table
  fig-prefix: Figure
  tbl-prefix: Table
  sec-prefix: Section

format:
  html:
    toc: false
    toc-depth: 3
    theme:
      - brand
      - styles.scss
    include-before-body: assets/studio-header.html
    title-block-style: none
    code-fold: true
    code-tools: false
    link-external-newwindow: true
  typst:
    papersize: us-letter
    mainfont: Inter
    fontsize: 10.5pt
    template-partials:
      - assets/typst-template.typ
      - assets/typst-show.typ
  docx:
    reference-doc: assets/reference-doc.docx
    toc: false