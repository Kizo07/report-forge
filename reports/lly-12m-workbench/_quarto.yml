project:
  type: default
  output-dir: output

execute:
  jupyter: reportforge
  echo: false
  warning: false
  message: false
  fig-dpi: 300
  freeze: auto

number-sections: true


format:
  html:
    toc: true
    toc-depth: 3
    theme:
      - brand
      - styles.scss
    code-fold: true
    code-tools: false
    link-external-newwindow: true
