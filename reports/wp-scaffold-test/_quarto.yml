project:
  type: default
  output-dir: output

execute:
  jupyter: reportforge
  echo: false
  warning: false
  message: false
  fig-dpi: 300
  freeze: auto

number-sections: true


crossref:
  fig-title: Exhibit
  tbl-title: Exhibit
  fig-prefix: Exhibit
  tbl-prefix: Exhibit
  sec-prefix: Section


format:
  html:
    toc: true
    toc-depth: 3
    theme:
      - brand
      - styles.scss
    code-fold: true
    code-tools: false
    link-external-newwindow: true
  pdf:
    pdf-engine: typst
    papersize: us-letter

    margin-x: 2cm
    margin-y: 2.2cm
    toc: true
    number-sections: true
    fig-pos: t
    colorlinks: true
    linkcolor: "#1a2e4a"
    urlcolor: "#3d6b9e"
    citecolor: "#5b6b7f"
  docx:
    reference-doc: assets/reference-doc.docx
    toc: true